    <rect x="723" y="1513" width="116" height="132" rx="17" fill="#d9dfe3"/><rect x="734" y="1524" width="94" height="101" rx="8" fill="#b6c1c9"/><circle cx="781" cy="1635" r="4" fill="#9aa7b0"/>

    <circle cx="71" cy="172" r="38" fill="#e1e5e8"/><circle cx="71" cy="161" r="11" fill="#9ba5ad"/><path d="M48 194 Q48 176 71 176 Q94 176 94 194" fill="#9ba5ad"/>

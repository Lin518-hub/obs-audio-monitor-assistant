<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1206 2622" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-label="直播界面占位图层" style="display:block;pointer-events:none">
  <defs><filter id="status-soft" x="-25%" y="-50%" width="150%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
